name: SQL Review
description: Reviews SQL changes for performance anti-patterns and data-access-policy violations, explaining findings with suggested fixes.
draft: true
source_file: examples/valid/sql-review.capability.yaml
source_context: Valid baseline, version 1.3.0, production maturity. Agent Skill and CLI; PostgreSQL and MySQL only. Static analysis, never executes queries.
abilities:
  - sql-review
  - sql-performance-analysis
  - data-access-policy-check
inputs:
  - name: sql-change
    type: string
    media_type: text/x-diff
    inferred: false
    description: Unified diff or SQL file content to review.
outputs:
  - name: review-findings
    type: string
    media_type: text/markdown
    inferred: false
    description: Findings with severity, location, and a suggested fix.
use_cases:
  - Review SQL in pull requests for performance anti-patterns
  - Check queries against the data-access policy
use_cases_basis: declared
