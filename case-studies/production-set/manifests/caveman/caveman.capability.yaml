supportedUseCases:
  - title: "Make agent replies terse"
    description: "Answer first, no ceremony; code, commands, paths, numbers, and errors kept verbatim."
  - title: "Report the current caveman mode"
    description: "`/caveman status` reports the mode and changes nothing."
setup: []
limitations:
  - "Stays on for the whole session until \"stop caveman\" or \"normal mode\"."
  - "Switches to plain prose for security warnings, irreversible actions, questions to the user, and anything persisted outside chat (code, comments, commits, docs, issues, tickets)."
  - "Mode status is tracked only on hosts that run the plugin's hooks; elsewhere `/caveman status` answers \"(not tracked by this host)\"."
  - "Median output reduction against an \"Answer concisely.\" control is 3% (n=10, one run, measured on the 3.1.0 skill text). It saves nothing on agents billed per request, and the project lists cases where it is net-negative."
