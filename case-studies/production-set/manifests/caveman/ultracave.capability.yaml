# Child of juliusbrussee/caveman-plugin. A voice mode implemented as its own skill: CLAUDE.md says
# skills/ultracave and skills/megacave "are self-contained and each map 1:1 to a stored mode". The base
# skill treats `/caveman ultra` as an alias that follows this skill.
