    method: native
    source: MCP Server Card, linked from Exa's AI Catalog at exa.ai/.well-known/ai-catalog.json.
    observedAt: "2026-11-16"
  - field: /publications/0/nativeVersion
    method: native
    source: MCP Server Card version (the hosted server; npm and the MCP Registry still state 3.4.3 and 3.4.1).
    observedAt: "2026-11-16"
  - field: /setup/1
