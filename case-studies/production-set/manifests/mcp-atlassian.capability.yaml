# Use case 1: an MCP server that reads Jira issues, updates their status, and supports summaries.
# Real public capability: MCP Atlassian by sooperset (github.com/sooperset/mcp-atlassian).
# Every value comes from its public sources, observed on 2026-11-13: the GitHub repository API, the
# latest GitHub release, the PyPI package, the README, and the documentation at
# mcp-atlassian.soomiles.com (llms-full.txt). provenance says where each value comes from.
#
# Not filled in, on purpose:
# - riskTier stays 'unassessed': no risk assessment exists. Only Mission 3 can set it.
# - maturity is assigned by Mission 2 (the inventory), not by the source.
# - lifecycleStatus is declared by the owner; the project does not declare one.
# The server also covers Confluence. It is described as one capability because it is one package
# and one process; the Jira tools are listed as embedded components.
schemaVersion: "0.1"
id: sooperset/mcp-atlassian
name: MCP Atlassian
description: >-
  Model Context Protocol (MCP) server for Atlassian products (Confluence and Jira), for Cloud and
  Server/Data Center deployments. Lets an AI assistant search Jira with JQL, read issue details,
  create and update issues, and change an issue's status through its workflow transitions.
capabilityType: mcp_server
capabilityVersion: "0.24.3"
source:
  type: repository
  url: https://github.com/sooperset/mcp-atlassian
  repositoryId: "897809208"
  status: active
publications:
  - kind: package
    locator: pkg:pypi/mcp-atlassian
    nativeName: mcp-atlassian
    nativeVersion: "0.24.3"
    versionScheme: pep440
    updatedAt: "2026-11-12"
    platformCompatibility:
      - claude-desktop
      - cursor
      - github-copilot
  - kind: container_image
    locator: ghcr.io/sooperset/mcp-atlassian
    nativeVersion: latest
    versionScheme: floating
    verifiedBy: Image published under the repository owner's GitHub Container Registry namespace and documented in the project's installation guide.
owner:
  name: sooperset
  contact: https://github.com/sooperset/mcp-atlassian/issues
  affiliation: external
license:
  expression: MIT
  scope: repository
documentation: https://mcp-atlassian.soomiles.com
keywords:
  - atlassian
  - jira
  - confluence
  - mcp
riskTier: unassessed
lastUpdated: "2026-11-16"
supportedUseCases:
  - title: Find and read Jira issues
    description: Search issues with JQL (jira_search) and read one issue with its comments (jira_get_issue).
  - title: Update the status of a Jira issue
    description: Move an issue through its workflow, for example to Done (jira_transition_issue).
  - title: Summarise Jira issues and sprints
    description: >-
      Returns issue, sprint, and search data that the AI assistant summarises. The server
      supplies the data; the summary is written by the assistant's model.
  - title: Create and edit Jira issues
    description: Create issues (jira_create_issue) and update their fields (jira_update_issue).
interfaces:
  - type: mcp
    transport: stdio
    description: >-
      Local MCP server started by the MCP client (the default). The same server also supports the
      sse and streamable-http transports for shared or multi-user deployments. Tools are discovered
      at runtime through tools/list.
embeddedComponents:
  - type: tool
    name: jira_search
    description: Search issues with JQL.
  - type: tool
    name: jira_get_issue
    description: Get issue details.
  - type: tool
    name: jira_create_issue
    description: Create an issue. Writes to Jira.
  - type: tool
    name: jira_update_issue
    description: Update an issue's fields. Writes to Jira.
  - type: tool
    name: jira_transition_issue
    description: Change an issue's status. Writes to Jira.
  - type: tool
    name: jira_get_sprint_issues
    description: List the issues in a sprint (agile toolset).
runtime:
  - kind: local_process
    detail: Python >=3.10.
  - kind: container
setup:
  - name: JIRA_URL
    kind: env_var
    description: Base URL of the Jira site, for example https://your-company.atlassian.net.
    secret: false
    required: true
  - name: JIRA_USERNAME
    kind: env_var
    group: jira-cloud
    description: Atlassian account email. Jira Cloud only, together with JIRA_API_TOKEN.
    secret: false
    required: true
  - name: JIRA_API_TOKEN
    kind: env_var
    group: jira-cloud
    description: Jira Cloud API token, created at id.atlassian.com/manage-profile/security/api-tokens.
    secret: true
    required: true
  - name: JIRA_PERSONAL_TOKEN
    kind: env_var
    group: jira-server-data-center
    description: Personal Access Token for Jira Server/Data Center, used instead of username and API token.
    secret: true
    required: true
  - name: READ_ONLY_MODE
    kind: env_var
    description: Set to true to disable all write operations (create, update, transition).
    secret: false
    required: false
  - name: TOOLSETS
    kind: env_var
    description: Restrict the tools offered, for example 'default' (about 35 core tools) or 'default,jira_agile'.
    secret: false
    required: false
integrations:
  - jira-cloud
  - jira-data-center
dependencies: []
limitations:
  - Not an official Atlassian product; maintained by an individual open-source maintainer.
  - Jira Server/Data Center is supported from version 8.14; Confluence Server/Data Center from 6.0.
  - Write tools (create, update, transition) are enabled unless READ_ONLY_MODE=true is set.
  - When TOOLSETS is not set, all toolsets are enabled (98 tools in total, Jira and Confluence).
  - Acts with the permissions of the Atlassian account whose token it is given.
  - The container image is documented with the floating tag 'latest'; pin a version for production.
costInformation:
  model: free
  details: MIT-licensed open source. Requires existing Atlassian (Jira) licences.
