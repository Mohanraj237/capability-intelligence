    source: npm package.json maintainers; the author field says only 'Playwright MCP contributors'.
    observedAt: "2026-10-22"
  - field: /license
    method: native
    source: npm package.json license; GitHub reports NOASSERTION for the repository's license file.
    observedAt: "2026-10-22"
  - field: /relations/0
    method: derived
