# Real external capability: a community fork of Playwright MCP, described from the npm package
# that the Spikes 1-3 research sampled on 2026-10-22 (research/spikes-1-3/samples, N1-04). Its npm
# description calls it a "Fork of official Playwright MCP", but GitHub does not record the
# repository as a fork, so the fork_of relation is recorded as claimed (verified: false) and the
# validator reports it as unverified. Validated together with playwright-mcp.capability.yaml, the
# relation's target resolves. Two values were inferred by heuristics and are reported as
# unconfirmed until someone confirms them.
schemaVersion: "0.1"
id: techyaditya/agentic-playwright-mcp
name: agentic-playwright-mcp
description: Fork of official Playwright MCP with multi-agent tab isolation via targetId
capabilityType: mcp_server
capabilityVersion: "1.2.2"
source:
  type: repository
  url: https://github.com/TechyAditya/agentic-playwright-mcp
  repositoryId: "1388811257"
publications:
