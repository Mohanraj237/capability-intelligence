    locator: pkg:npm/agentic-playwright-mcp
    nativeVersion: "1.2.2"
    versionScheme: semver
    updatedAt: "2026-09-28"
owner:
  name: techyaditya
  contact: https://github.com/TechyAditya/agentic-playwright-mcp/issues
  affiliation: external
license:
  expression: MIT
  scope: capability
documentation: https://github.com/TechyAditya/agentic-playwright-mcp#readme
keywords:
  - mcp
  - playwright
  - browser
  - automation
  - multi-agent
  - tab-isolation
  - cdp
riskTier: unassessed
lastUpdated: "2026-10-22"
interfaces:
  - type: mcp
    description: MCP server, started from the agentic-playwright-mcp command.
  - type: cli
    description: Commands apmcp and apmcp-daemon.
runtime:
  - kind: local_process
    detail: Node.js >=18.0.0
relations:
  - type: fork_of
    id: microsoft/playwright-mcp
    evidence: "npm description: 'Fork of official Playwright MCP'. GitHub does not record the repository as a fork."
    verified: false
provenance:
