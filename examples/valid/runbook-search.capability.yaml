# Internal tool distributed through a package registry, and an independently adoptable component
# of the sre-toolkit bundle (linked through parent). Its setup lists the credential an adopter needs.
schemaVersion: "0.1"
id: sre/runbook-search
name: Runbook Search
description: >-
  Semantic search over the SRE runbook library. Returns the runbook sections most
  relevant to an alert, service, or symptom, with links to the source pages.
capabilityType: tool
capabilityVersion: "2.1.0"
source:
  type: registry
  registry: npm
  identifier: "@example-org/runbook-search"
owner:
  name: Site Reliability Engineering
  contact: sre-tools@example.com
  affiliation: internal
license:
  expression: LicenseRef-Example-Internal
lifecycleStatus: active
riskTier: medium
assessmentReference:
  id: RA-2026-0097
  assessedOn: "2026-06-03"
lastUpdated: "2026-10-01"
parent:
  id: sre/sre-toolkit
supportedUseCases:
  - title: Find the runbook for an alert or symptom
interfaces:
  - type: openapi
    contractRef: https://runbooks.example.com/api/openapi.json
    inputs:
      - name: query
        mediaType: application/json
    outputs:
      - name: runbook-matches
        mediaType: application/json
  - type: library
    description: JavaScript client published as @example-org/runbook-search.
runtime:
  - kind: hosted_service
    detail: Search API at runbooks.example.com.
  - kind: local_process
    detail: JavaScript client library (Node.js).
setup:
  - name: RUNBOOK_SEARCH_TOKEN
    description: API token from the SRE tools portal.
    secret: true
    required: true
dependencies: []
limitations:
  - Indexes the SRE wiki only; team-specific wikis are not included.
