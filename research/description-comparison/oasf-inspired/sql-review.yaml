# Simplified local adaptation, not an OASF-valid record. See ../results.md.
name: SQL Review
description: Reviews SQL changes for performance anti-patterns and data-access-policy violations, explaining findings with suggested fixes.
oasf_reference:
  schema_version: "1.1.3"
  source_ref: v1.1.3
mapped_skills:
  - taxonomy_path: software_engineering/code_quality
    caption: Code Quality and Maintenance
    mapping: Broader category for SQL review; does not by itself encode SQL dialects or policy checks.
custom_details:
  source_draft: ability-descriptions/sql-review.ability.yaml
  abilities: [sql-review, sql-performance-analysis, data-access-policy-check]
  inputs:
    - name: sql-change
      type: string
      media_type: text/x-diff
      inferred: false
      description: Unified diff or SQL file content to review.
  outputs:
    - name: review-findings
      type: string
      media_type: text/markdown
      inferred: false
      description: Findings with severity, location, and a suggested fix.
  use_cases:
    - Review SQL in pull requests for performance anti-patterns
    - Check queries against the data-access policy
  constraints:
    supported_dialects: [PostgreSQL, MySQL]
    query_execution: false
  type_status: Proposed types; referenced runtime contracts have not been inspected.
