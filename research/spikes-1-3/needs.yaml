# Pre-registered journeys, needs, relevance criteria, and sampling rule for the Spikes 1-3
# research (docs/spikes-1-3-research.md). Written on 2026-10-22, before any candidate
# capability was snapshotted or judged. The needs refine the use cases that iteration 1 of the
# journey pilot pre-registered (pilot/journeys.yaml: browser, code-hosting, search, documents),
# so that each one can be judged against a stated criterion. They are not changed afterwards;
# any later deviation is recorded in research/spikes-1-3/README.md under "Deviations".

journeys:
  - id: J1
    title: Find an existing capability before building one
    user: A developer whose team is about to build an agent integration
    goal: Find capabilities that already meet the need, across every source the team can use
    success: >-
      Every capability judged relevant is found; capabilities judged not relevant are not
      presented as matches; results from different sources and packaging types appear together.

  - id: J2
    title: Recognise duplicates and overlaps across sources
    user: The same developer, or a curator keeping a shared list of approved capabilities
    goal: Know which entries are the same capability published in several places, which are
      forks or wrappers of it, and which are different capabilities that serve the same need
    success: >-
      Entries of one capability are grouped (no double counting); different capabilities are
      never merged; forks and wrappers are linked to what they wrap, not merged into it.

  - id: J3
    title: Compare candidates and decide whether to reuse, adapt, or build
    user: The team that shortlisted two or more candidates
    goal: Compare function, interface and compatibility, setup and dependencies, limitations,
      terms of use, and maintenance, then decide
    success: >-
      Each comparison question is answered from metadata with its source, or is explicitly
      marked unknown; a reuse, adapt, or build decision can be justified or is clearly blocked.

  - id: J4
    title: Judge whether there is enough information, and know what to ask
    user: A consumer of the shared metadata (for example a recommender or a reviewer)
    goal: Decide whether a discovered capability has enough information to assess suitability,
      and see which facts need owner input or human verification
    success: >-
      Every decision-relevant fact carries its provenance; facts that are inferred, ambiguous,
      or governance-owned are flagged rather than filled in.

# Comparison questions used by J3 and J4 (decision-relevant facts).
questions:
  - { id: what, ask: What does it do?, journey: [J1, J3] }
  - { id: kind, ask: What kind of capability is it, and how is it packaged?, journey: [J1, J3] }
  - { id: interface, ask: How does an agent or system use it (protocol, transport, host)?, journey: [J3] }
  - { id: runs-where, ask: Where does it run (local process, container, hosted service) and on what runtime?, journey: [J3] }
  - { id: setup, ask: What credentials, accounts, or configuration does it need?, journey: [J3] }
  - { id: depends, ask: What does it depend on (other capabilities, services, runtimes)?, journey: [J3] }
  - { id: limits, ask: What are its known limitations?, journey: [J3] }
  - { id: terms, ask: May we use and modify it, and under what license or terms?, journey: [J3, J4] }
  - { id: version, ask: Which version is current, and how are versions identified?, journey: [J3] }
  - { id: maintained, ask: Is it maintained, deprecated, or replaced?, journey: [J3, J4] }
  - { id: who, ask: Who publishes and maintains it, and is that verified?, journey: [J3, J4] }
  - { id: same-as, ask: Is it the same capability as another entry?, journey: [J2] }
  - { id: risk, ask: Has it been risk-assessed, and with what result?, journey: [J4], governance: true }

# Concrete needs. "terms" are what a developer would type; they drive both the searches of the
# real registries and the local matcher. Relevance is judged from the capability's own
# documentation against "relevant" and "partial", never from the matcher's output.
needs:
  - id: N1
    origin: iteration-1 use case "browser"
    statement: >-
      Let our coding agent open our web application in a real browser, click through a flow,
      fill in forms, and take screenshots, so that it can test UI changes.
    relevant: The capability lets an agent drive a real browser interactively (navigate, click, type, read the page or take screenshots).
    partial: Browser automation that an agent cannot use directly (a plain library), or page fetching or scraping without interaction.
    terms: [browser, playwright, puppeteer, selenium, e2e, screenshot, web app testing]
    primaryQuery: playwright

  - id: N2
    origin: iteration-1 use case "code-hosting"
    statement: >-
      Let an agent read and update GitHub issues and pull requests in our repositories: read
      them, comment, label, and open pull requests.
    relevant: The capability gives an agent read and write operations on GitHub issues and pull requests.
    partial: GitHub-related but narrower (one workflow only, such as fixing CI or answering review comments) or read-only.
    terms: [github, pull request, pull requests, issue, issues]
    primaryQuery: github

  - id: N3
    origin: iteration-1 use case "search"
    statement: >-
      Give an agent live web search, with result URLs it can cite, for questions about
      current information.
    relevant: The capability runs web search queries and returns results with their URLs.
    partial: Fetches or scrapes a given URL without searching, or searches a single site or a closed corpus.
    terms: [web search, search engine, search api, serp, internet search]
    primaryQuery: search

  - id: N4
    origin: iteration-1 use case "documents", narrowed
    statement: Extract the text and tables from PDF files inside an agent workflow.
    relevant: The capability reads existing PDF files and returns their text, and tables where present.
    partial: Converts PDFs or other documents to text or Markdown without table handling, or handles PDFs only as one format among many without stating extraction.
    terms: [pdf, pdfs, extract text, tables, document conversion, ocr]
    primaryQuery: pdf

# Sampling rule (applied per need; each snapshot records which step selected it):
# 1. Sources and their result lists:
#    - official MCP Registry: first result page of search=<primaryQuery>, active entries only;
#    - npm: first 20 results of the text search "<primaryQuery> mcp";
#    - Agent Skills (anthropics/skills, openai/skills, github/awesome-copilot, counted as ONE
#      listing), the official Claude Code plugin marketplace, and the Docker MCP catalog: the
#      entries whose name, title, or description contains the primaryQuery or a term as a whole
#      word.
# 2. From each source, take at most two entries per need:
#    - purposive: the vendor's own publication of the technology the need names, where the
#      source has one (N1: Microsoft's Playwright MCP server; N2: GitHub's MCP server; none for
#      N3 and N4);
#    - random: the remaining places are drawn from the source's result list with seed 20261022.
# 3. Purposive additions, named here before sampling, for packaging types that have no searched
#    source: PyPI framework integrations (N1 browser-use, N3 langchain-tavily, N4 docling) and a
#    GitHub Actions workflow (N2 anthropics/claude-code-action).
# 4. Cross-listings: when a selected entry declares another publication of itself (a package
#    in server.json, a source repository in a catalog entry, an MCP server in a plugin), that
#    publication is snapshotted too, so that J2 can be tested on links that really exist.
# 5. A2A Agent Cards: there is no registry of them to sample per need. The JSON files among the
#    first 50 GitHub code-search results for the filename agent-card.json are snapshotted as a
#    separate conformance sample, and join the background.
# 6. Background: the 12 randomly sampled capabilities of iteration 1 (pilot/samples) are added
#    unchanged as non-targeted entries, so that J1 is also tested against unrelated material.
